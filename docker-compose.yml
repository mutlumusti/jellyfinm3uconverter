version: "3.8"

services:
  iptv-processor:
    build: .
    container_name: iptv-processor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - TZ=Europe/Istanbul # Kendi zaman diliminize göre ayarlayabilirsiniz
    volumes:
      - ./iptv_data:/app/data
